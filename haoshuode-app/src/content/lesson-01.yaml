id: lesson-01
type: lesson
lessonNumber: 1
order: 1
title:
  eng: "Sounds and Symbols"
  rus: "Звуки и символы"
  zh: "声音与符号"

summary:
  eng: "Pinyin is read syllable by syllable, tone is part of the word's meaning, and Hao-shuo-de adds a small punctuation layer — solid compounds, hyphens for bound grammar, quotes for the untranslatable — on top of it."
  rus: "Пиньинь читается по слогам, тон — часть значения слова, а Hao-shuo-de добавляет поверх него небольшой слой пунктуации: слитные слова, дефис для связанной грамматики и кавычки для непереводимого."
  zh: "拼音要逐音节朗读，声调是词义的一部分，Hao-shuo-de 在此基础上又加了一层小小的标点规则：连写的词、绑定语法的连字符，以及标出不可译内容的引号。"

blocks:
  - type: prose
    text:
      eng: |-
        Chinese doesn't write itself out letter by letter, in one continuous stream of sound the way English words like "understand" do. It's built in blocks — one block per syllable, and (mostly) one syllable per idea. Pinyin keeps that structure visible: <audio-example zh="中国">Zhōngguó</audio-example>, the word for China, isn't read as one long fused sound; it's two syllables, <audio-example zh="中">Zhōng</audio-example> and <audio-example zh="国">guó</audio-example>, sitting side by side. Get in the habit of reading pinyin syllable by syllable, the way it's actually spoken, rather than stressing it the way you would an English word. This one habit will save you from a hundred small mispronunciations later.
      rus: |-
        Китайский язык не записывается буква за буквой, сплошным потоком звуков, как английские слова вроде «understand». Он строится из блоков — один блок на слог и (в основном) один слог на понятие. Пиньинь сохраняет эту структуру наглядной: <audio-example zh="中国">Zhōngguó</audio-example> — слово для Китая — читается не как одно длинное слитное звучание; это два слога, <audio-example zh="中">Zhōng</audio-example> и <audio-example zh="国">guó</audio-example>, стоящие рядом. Возьмите за привычку читать пиньинь по слогам, так, как оно произносится на самом деле, а не ударять его так, как вы ударили бы английское слово. Одна эта привычка избавит вас в дальнейшем от сотни мелких ошибок в произношении.
      zh: |-
        汉语不是像英语单词 "understand" 那样，一个字母接一个字母地写成一串连续的声音流。它是按音节块构建的——一个音节一块，并且（大多数情况下）一个概念对应一个音节。拼音使这种结构一目了然：<audio-example zh="中国">Zhōngguó</audio-example>（中国）不是读成一个长长的融合音；而是两个音节，<audio-example zh="中">Zhōng</audio-example> 和 <audio-example zh="国">guó</audio-example> 并排在一起。要养成逐音节读拼音的习惯，按照它实际发音的方式去读，而不是像读英语单词那样去重读。这一个习惯会让你以后免于成百上千个小错误。
    tldr:
      eng: "Read pinyin syllable-by-syllable, not stressed like an English word."
      rus: "Читайте пиньинь по слогам, а не с ударением, как английское слово."
      zh: "按音节逐个朗读拼音，不要像读英语单词那样重读。"
    necessity:
      eng: "Sets the core reading habit before any vocabulary is introduced."
      rus: "Задаёт основную привычку чтения ещё до знакомства с лексикой."
      zh: "在学习任何词汇之前，先建立最基本的阅读习惯。"

  - type: prose
    text:
      eng: |-
        Beyond that, most pinyin reads close to what you'd expect from Latin letters — but not identical, and a few spellings are outright misleading if you read them as English. `c` sounds like the "ts" in "cats," not like a "k" or an "s." `q` and `x` don't exist as English sounds at all; the closest approximations are a light "ch" and a light "sh." And some vowel combinations hide sounds that aren't obvious from the letters at all — <audio-example zh="云">yun</audio-example>, for instance, isn't pronounced "yoon"; it's closer to "yoo-in," built around a vowel English doesn't have. Rather than front-load every rule here, this book keeps a complete sound-by-sound reference — the full pinyin system, letter by letter, with every one of these traps flagged — in the **Pinyin Appendix** at the back. Whenever a word's spelling doesn't tell you how to say it, that's where to look.
      rus: |-
        Кроме того, большая часть пиньиня читается примерно так, как можно ожидать от латинских букв, — но не полностью, и некоторые написания вводят в заблуждение, если читать их по-английски. `c` звучит как «ц» в слове «цапля», а не как «к» или «с». `q` и `x` как английские звуки вообще не существуют; ближайшие приближения — лёгкое «ч» и лёгкое «шь». А некоторые сочетания гласных скрывают звуки, которые по буквам совершенно не очевидны — например, <audio-example zh="云">yun</audio-example> произносится не как «юн»; оно ближе к «юйнь» и строится вокруг гласного, которого в английском нет. Вместо того чтобы перегружать здесь всеми правилами, эта книга содержит полный пофонемный справочник — всю систему пиньиня, буква за буквой, с пометками обо всех этих ловушках — в **Приложении по пиньиню** в конце. Всякий раз, когда написание слова не подсказывает, как его произносить, — обращайтесь туда.
      zh: |-
        除此之外，大多数拼音的读法与你对拉丁字母的预期相差不远——但并不完全相同，有些拼写如果按英语读法会完全误导你。`c` 听起来像 "cats" 中的 "ts"，不是 "k" 或 "s"。`q` 和 `x` 在英语中根本没有对应音；最接近的是轻 "ch" 和轻 "sh"。有些元音组合隐藏着从字母上完全看不出来的读音——例如 <audio-example zh="云">yun</audio-example> 不读作 "yoon"；它更接近 "ü + n" 的组合，围绕着一个英语中没有的元音。本书不在这里罗列所有规则，而是将完整的声母韵母对照表——整个拼音体系，逐个字母，标出每一个陷阱——放在书末的**拼音附录**中。每当一个词的拼写没有告诉你如何发音时，就请查阅那里。
    tldr:
      eng: "Some pinyin letters (c, q, x) and vowel combos (yun) don't sound like English."
      rus: "Некоторые буквы пиньиня (c, q, x) и гласные сочетания (yun) звучат не так, как в английском."
      zh: "有些拼音字母（c、q、x）和元音组合（yun）读法和英语不同。"
    necessity:
      eng: "Warns against silently mispronouncing common letters by English habit."
      rus: "Предупреждает от молчаливого неправильного произношения по английской привычке."
      zh: "提醒读者不要凭英语习惯默默读错这些常见字母。"

  - type: heading
    text:
      eng: "Tones"
      rus: "Тоны"
      zh: "声调"

  - type: prose
    text:
      eng: |-
        One thing pinyin can't hide, though, is tone — and tone is not a decoration, it's part of the word. Say <audio-example zh="妈">mā</audio-example> (mother), <audio-example zh="麻">má</audio-example> (hemp), <audio-example zh="马">mǎ</audio-example> (horse), and <audio-example zh="骂">mà</audio-example> (to scold) with the wrong pitch, and you haven't mispronounced a word — you've said a different one.
      rus: |-
        Однако тоны пиньинь не может скрыть — и тон не украшение, а часть слова. Произнесите <audio-example zh="妈">mā</audio-example> (мама), <audio-example zh="麻">má</audio-example> (конопля), <audio-example zh="马">mǎ</audio-example> (лошадь) и <audio-example zh="骂">mà</audio-example> (ругать) с неправильной высотой тона — и вы не просто неправильно произнесёте слово, а скажете совсем другое.
      zh: |-
        不过，有一件事拼音无法隐藏——那就是声调。声调不是装饰，而是词的一部分。把 <audio-example zh="妈">mā</audio-example>（妈妈）、<audio-example zh="麻">má</audio-example>（麻）、<audio-example zh="马">mǎ</audio-example>（马）和 <audio-example zh="骂">mà</audio-example>（骂）用错音高说出来，你就不是发错了一个词——而是说出了另一个词。
    tldr:
      eng: "Wrong tone = wrong word, not just an accent."
      rus: "Неправильный тон — это другое слово, а не просто акцент."
      zh: "声调错了就是另一个词，不只是口音问题。"
    necessity:
      eng: "Establishes that tone is meaning-bearing, not optional inflection."
      rus: "Устанавливает, что тон несёт смысл, а не является необязательной интонацией."
      zh: "确立声调承载意义，而不是可有可无的语调。"

  - type: prose
    text:
      eng: |-
        - **ā** — First tone. Flat and held, like humming a single note and not letting it move.
        - **á** — Second tone. Rising, like the "huh?" you say when you mishear something.
        - **ǎ** — Third tone. Dips down, then curls back up — the sound of a skeptical "hmm..."
        - **à** — Fourth tone. Sharp and falling, like a flat, final "No."
      rus: |-
        - **ā** — Первый тон. Ровный и долгий, словно вы гудите одну ноту и не даёте ей сдвигаться.
        - **á** — Второй тон. Восходящий, как «а?», которое вы говорите, когда не расслышали.
        - **ǎ** — Третий тон. Сначала понижается, затем загибается вверх — звук скептического «хм...».
        - **à** — Четвёртый тон. Резкий и нисходящий, как отрывистое, окончательное «Нет».
      zh: |-
        - **ā** —— 一声。高平，保持平稳，像哼一个音高不变。
        - **á** —— 二声。上升，像没听清时说的 "嗯？"。
        - **ǎ** —— 三声。先降后升，像怀疑的 "嗯..."。
        - **à** —— 四声。短促下降，像干脆利落的 "不！"。
    tldr:
      eng: "Four tones: flat, rising, dip-then-rise, sharp fall."
      rus: "Четыре тона: ровный, восходящий, сначала вниз затем вверх, резко нисходящий."
      zh: "四个声调：平、升、先降后升、陡降。"
    necessity:
      eng: "Gives a concrete, memorable shape to each of the four tones."
      rus: "Даёт конкретный, запоминающийся образ для каждого из четырёх тонов."
      zh: "为四个声调分别给出具体、易记的形象。"

  - type: prose
    text:
      eng: |-
        There is also a neutral tone. It is written without a tone mark — just a plain letter: **a**. The neutral syllable is shorter and receives no emphasis.
      rus: |-
        Существует также нейтральный тон. Он пишется без знака тона — просто обычная буква: **a**. Нейтральный слог короче и не получает ударения.
      zh: |-
        还有一种轻声。它不加声调符号——只写普通字母：**a**。轻声音节较短，不重读。
    tldr:
      eng: "A fifth, unmarked tone exists: short and unstressed."
      rus: "Существует пятый, немаркированный тон: короткий и безударный."
      zh: "还存在第五种不标符号的声调：短促、不重读。"
    necessity:
      eng: "Introduces the neutral tone before it appears in the language's own name."
      rus: "Знакомит с нейтральным тоном до того, как он появится в названии самого языка."
      zh: "在轻声出现在语言自己的名字之前先介绍它。"

  - type: prose
    text:
      eng: |-
        In <audio-example zh="好说的">{{word:good}}-{{word:communicate}}-{{word:possessive-marker}}</audio-example>, the `-de` is neutral.
      rus: |-
        В <audio-example zh="好说的">{{word:good}}-{{word:communicate}}-{{word:possessive-marker}}</audio-example> `-de` стоит в нейтральном тоне.
      zh: |-
        在 <audio-example zh="好说的">{{word:good}}-{{word:communicate}}-{{word:possessive-marker}}</audio-example> 中，`-de` 是轻声。
    tldr:
      eng: "The -de in hǎo-shuō-de is neutral-toned."
      rus: "«-de» в hǎo-shuō-de произносится нейтральным тоном."
      zh: "hǎo-shuō-de 中的 `-de` 读轻声。"
    necessity:
      eng: "Anchors the abstract neutral-tone rule to a word the reader already knows."
      rus: "Привязывает абстрактное правило нейтрального тона к уже знакомому читателю слову."
      zh: "把抽象的轻声规则落实到读者已经认识的词上。"

  - type: prose
    text:
      eng: |-
        Reading Chinese syllable by syllable is the rule. The neutral tone is the single exception. When a neutral tone appears, the syllable before it takes the stress. The neutral syllable itself is just a short, attached sound. <audio-example zh="好说的">{{word:good}}-{{word:communicate}}-{{word:possessive-marker}}</audio-example> is not three equal beats. It is pronounced _how-show-duh_ — the final syllable trails off.
      rus: |-
        Чтение китайского по слогам — это правило. Нейтральный тон — единственное исключение. Когда появляется нейтральный тон, ударение получает слог перед ним. Сам нейтральный слог — это лишь короткий прикреплённый звук. <audio-example zh="好说的">{{word:good}}-{{word:communicate}}-{{word:possessive-marker}}</audio-example> — это не три равных такта. Оно произносится _хао-шуо-дэ_ — последний слог затихает.
      zh: |-
        逐音节读汉语是规则。轻声是唯一的例外。当轻声出现时，它前面的音节承担重音。轻声本身只是一个短促的附缀音。<audio-example zh="好说的">{{word:good}}-{{word:communicate}}-{{word:possessive-marker}}</audio-example> 不是三个等长的节拍。它读作 _hǎo-shuō-de_ —— 最后一个音节轻轻地收尾。
    tldr:
      eng: "The syllable before a neutral tone gets the stress instead."
      rus: "Слог перед нейтральным тоном получает ударение вместо него."
      zh: "轻声前面的音节代替它承担重音。"
    necessity:
      eng: "States the one exception to reading every syllable with equal weight."
      rus: "Формулирует единственное исключение из чтения каждого слога с равным весом."
      zh: "说明每个音节等重朗读规则的唯一例外。"

  - type: prose
    text:
      eng: |-
        Without this exception, spoken Chinese would become a mechanical sequence of separate blocks — correct, but unnatural. The neutral tone is what keeps the rhythm from breaking apart.
      rus: |-
        Без этого исключения разговорный китайский стал бы механической последовательностью отдельных блоков — правильно, но неестественно. Именно нейтральный тон не даёт ритму распадаться.
      zh: |-
        没有这个例外，口语汉语就会变成一串机械的独立音节——正确，但不自然。正是轻声阻止了节奏的崩解。
    tldr:
      eng: "Without the neutral tone, speech would sound robotic."
      rus: "Без нейтрального тона речь звучала бы механически."
      zh: "没有轻声，说话会显得机械。"
    necessity:
      eng: "Explains why the exception exists, not just that it exists."
      rus: "Объясняет, почему существует исключение, а не просто то, что оно существует."
      zh: "解释这个例外为什么存在，而不只是说它存在。"

  - type: prose
    text:
      eng: |-
        - **a** — Neutral tone. Short, unstressed, no pitch direction.
      rus: |-
        - **a** — Нейтральный тон. Короткий, безударный, без направленного изменения высоты.
      zh: |-
        - **a** —— 轻声。短促、不重读、没有调值方向。
    tldr:
      eng: "Neutral tone: short, unstressed, no pitch direction."
      rus: "Нейтральный тон: короткий, безударный, без направления высоты."
      zh: "轻声：短促、不重读、没有调值方向。"
    necessity:
      eng: "Completes the five-tone reference list started above."
      rus: "Завершает справочный список из пяти тонов, начатый выше."
      zh: "补全上文开始的五声参考列表。"

  - type: prose
    text:
      eng: |-
        This book always writes a word's dictionary tone — the tone it carries in the dictionary — even in places where fast, natural speech would blur or shift it slightly. That keeps every written form consistent and lookup-able, at the small cost of not capturing every detail of how a sentence actually sounds out loud.
      rus: |-
        В этой книге всегда пишется словарный тон слова — тот тон, который оно несёт в словаре, — даже в тех местах, где в быстрой, естественной речи он может смазываться или слегка меняться. Это сохраняет единообразие написания и возможность поиска ценой того, что не передаются все детали того, как предложение на самом деле звучит в устной речи.
      zh: |-
        本书始终标注词的词典声调——即它在词典中的声调——即使在快速、自然的口语中可能会变调或轻微偏移的地方也是如此。这保持了书写形式的一致性和可查性，代价是无法捕捉句子实际口头发音的所有细节。
    tldr:
      eng: "This book always writes a word's dictionary tone, even where speech blurs it."
      rus: "Эта книга всегда пишет словарный тон слова, даже там, где речь его смазывает."
      zh: "本书始终标注词的词典声调，即使口语会把它模糊掉。"
    necessity:
      eng: "Sets reader expectations for why written tones may not match fast speech."
      rus: "Задаёт ожидания читателя: почему письменные тоны могут не совпадать с быстрой речью."
      zh: "设定读者预期：书面声调为何可能和快速口语不一致。"

  - type: prose
    text:
      eng: |-
        Because tone marks are awkward to type on an ordinary keyboard, there's a standard shorthand you'll meet in apps, dictionaries, and casual typing: write the tone as a digit right after the syllable instead of as a mark above the vowel. <audio-example zh="你好">Nǐ hǎo</audio-example> becomes `ni3 hao3`. This book always uses proper tone marks, but recognizing the number system will save you confusion the first time you run into it elsewhere.
      rus: |-
        Поскольку знаки тонов неудобно набирать на обычной клавиатуре, существует стандартное сокращение, с которым вы столкнётесь в приложениях, словарях и неформальном наборе: тон записывается цифрой сразу после слога вместо знака над гласной. <audio-example zh="你好">Nǐ hǎo</audio-example> превращается в `ni3 hao3`. В этой книге всегда используются полноценные знаки тонов, но умение распознавать цифровую систему избавит вас от путаницы, когда вы впервые встретите её в другом месте.
      zh: |-
        由于声调符号在普通键盘上不易输入，你会在应用程序、词典和非正式打字中遇到一种标准简写法：用数字标在音节后面，而不是标在元音上。<audio-example zh="你好">Nǐ hǎo</audio-example> 变成 `ni3 hao3`。本书始终使用标准的声调符号，但识别数字系统会让你第一次在其他地方碰到它时免于困惑。
    tldr:
      eng: "Tones can also be written as digits after the syllable, e.g. ni3 hao3."
      rus: "Тоны можно также записывать цифрами после слога, например ni3 hao3."
      zh: "声调也可以用音节后的数字表示，例如 ni3 hao3。"
    necessity:
      eng: "Prepares the reader to recognize tone numbers used elsewhere, outside this book."
      rus: "Готовит читателя узнавать цифровую запись тонов, встречающуюся вне этой книги."
      zh: "让读者能认出书外常见的数字声调标注法。"

  - type: heading
    text:
      eng: "Writing Hao-shuo-de"
      rus: "Запись Hao-shuo-de"
      zh: "书写 Hao-shuo-de"

  - type: prose
    text:
      eng: |-
        Reading tones and syllables gets you through any pinyin text. But Hao-shuo-de adds a small layer of its own notation on top, to keep vocabulary and grammar visually distinct as you read:
      rus: |-
        Чтение тонов и слогов позволяет разобраться в любом тексте на пиньине. Но Hao-shuo-de добавляет поверх этого свой небольшой слой разметки, чтобы лексика и грамматика были зрительно различимы при чтении:
      zh: |-
        读声调和音节能让你读懂任何拼音文本。但 Hao-shuo-de 在其之上又加了一层小小的标注规则，以便你在阅读时从视觉上区分词汇和语法：
    tldr:
      eng: "Hao-shuo-de adds its own notation on top of pinyin."
      rus: "Hao-shuo-de добавляет собственную разметку поверх пиньиня."
      zh: "Hao-shuo-de 在拼音之上又加了一层自己的标注。"
    necessity:
      eng: "Frames the three punctuation rules that follow as one system."
      rus: "Объединяет три следующих правила пунктуации в одну систему."
      zh: "把接下来的三条标点规则整合成一个系统来介绍。"

  - type: prose
    text:
      eng: |-
        1. **Words stay solid.** When several syllables form one dictionary word, they're never split apart, no matter how long the word is — <audio-example zh="动物">dòngwù</audio-example>, <audio-example zh="睡觉">shuìjiào</audio-example>, <audio-example zh="但是">dànshì</audio-example>. Read a solid block as a single unit.
        2. **Hyphens bind grammar.** A hyphen glues a grammar particle, measure word, or description directly onto the word it modifies — <audio-example zh="这个">zhè-ge</audio-example> (this one), <audio-example zh="一个">yī-ge</audio-example> (one thing), <audio-example zh="很大的">hěn-dà-de</audio-example> (very big). A hyphen always signals "these two pieces work as one" — never a word break.
        3. **Quotes wall off the untranslatable.** Proper names and imitated sounds — things that aren't really Hao-shuo-de vocabulary at all — are kept inside quotation marks: `"Beijing"`, <audio-example zh="叫汪汪">jiào "wāng-wāng"</audio-example> (goes "woof woof"). If you see quotes, don't look for the word in the dictionary; it isn't one.
      rus: |-
        1. **Слова пишутся слитно.** Когда несколько слогов образуют одно словарное слово, они никогда не разделяются, какой бы длинной ни была лексема, — <audio-example zh="动物">dòngwù</audio-example>, <audio-example zh="睡觉">shuìjiào</audio-example>, <audio-example zh="但是">dànshì</audio-example>. Читайте слитный блок как единое целое.
        2. **Дефис связывает грамматику.** Дефис прикрепляет грамматическую частицу, счётное слово или определение непосредственно к слову, которое оно определяет, — <audio-example zh="这个">zhè-ge</audio-example> (этот), <audio-example zh="一个">yī-ge</audio-example> (одна вещь), <audio-example zh="很大的">hěn-dà-de</audio-example> (очень большой). Дефис всегда сигнализирует: «эти две части работают как одно» — и никогда не обозначает разрыв слова.
        3. **Кавычки отделяют непереводимое.** Имена собственные и звукоподражания — то, что по сути не является лексикой Hao-shuo-de, — заключаются в кавычки: `"Beijing"`, <audio-example zh="叫汪汪">jiào "wāng-wāng"</audio-example> (лает «гав-гав»). Если видите кавычки, не ищите это слово в словаре; оно не словарное.
      zh: |-
        1. **词语连写。** 当几个音节构成一个词典词时，无论这个词有多长，它们都不分开——<audio-example zh="动物">dòngwù</audio-example>、<audio-example zh="睡觉">shuìjiào</audio-example>、<audio-example zh="但是">dànshì</audio-example>。把连写块当作一个整体来读。
        2. **连字符绑定语法。** 连字符把语法助词、量词或修饰语直接粘到它所修饰的词上——<audio-example zh="这个">zhè-ge</audio-example>（这个）、<audio-example zh="一个">yī-ge</audio-example>（一个）、<audio-example zh="很大的">hěn-dà-de</audio-example>（很大的）。连字符始终表示 "这两部分作为一个整体"——绝不是分词的标记。
        3. **引号隔开不可译内容。** 专有名词和拟声词——那些本质上不属于 Hao-shuo-de 词汇的东西——放在引号里：`"Beijing"`、<audio-example zh="叫汪汪">jiào "wāng-wāng"</audio-example>（汪汪叫）。如果看到引号，不要到词典里去查这个词；它不是词。
    tldr:
      eng: "Words stay solid, hyphens bind grammar, quotes wall off untranslatable words."
      rus: "Слова пишутся слитно, дефис связывает грамматику, кавычки отделяют непереводимое."
      zh: "词语连写，连字符绑定语法，引号隔开不可译内容。"
    necessity:
      eng: "Defines the three punctuation conventions used throughout the whole book."
      rus: "Определяет три пунктуационных соглашения, используемых во всей книге."
      zh: "定义全书通用的三条标点约定。"

  - type: exercise
    items:
      - eng: "Break Zhōngguórén into its syllables."
        rus: "Разбейте Zhōngguórén на слоги."
        zh: "把 Zhōngguórén 拆成音节。"
      - eng: "Which tone is this: à (fourth tone mark)? Describe it in one word."
        rus: "Какой это тон: à (знак четвёртого тона)? Опишите его одним словом."
        zh: "这是什么声调：à（四声符号）？用一个词描述它。"
      - eng: "Rewrite Wǒ hǎo using tone-number notation instead of tone marks."
        rus: "Перепишите Wǒ hǎo в тоново-цифровой записи вместо знаков тонов."
        zh: "把 Wǒ hǎo 用声调数字标注法改写（不用声调符号）。"
      - eng: "Is hěn-dà-de one dictionary word, or a word plus a bound grammar piece? How do you know from the punctuation alone?"
        rus: "Является ли hěn-dà-de одним словарным словом или словом плюс привязанной грамматической частью? Как вы это определяете только по знакам препинания?"
        zh: "hěn-dà-de 是一个词典词，还是一个词加一个粘着的语法成分？仅凭标点你如何判断？"

  - type: answers
    items:
      - text:
          eng: "Zhōng-guó-rén (three syllables: Zhōng, guó, rén)."
          rus: "Zhōng-guó-rén (три слога: Zhōng, guó, rén)."
          zh: "Zhōng-guó-rén（三个音节：Zhōng、guó、rén）。"
      - text:
          eng: "Fourth tone — sharp and falling."
          rus: "Четвёртый тон — резкий и нисходящий."
          zh: "四声 —— 短促下降。"
      - text:
          eng: "Wo3 hao3."
          rus: "Wo3 hao3."
          zh: "Wo3 hao3。"
      - text:
          eng: "A word (dà, big) plus a bound grammar piece (-de) — the hyphen shows they're glued together, not a single solid dictionary word."
          rus: "Слово (dà, большой) плюс привязанная грамматическая часть (-de) — дефис показывает, что они скреплены вместе, а не являются единым слитным словарным словом."
          zh: "一个词（dà，大）加上一个粘着的语法成分（-de）—— 连字符表明它们是粘在一起的，而不是一个固实的词典词。"
