          rus: "Школа / дом знаний имеет книги."
          zh: "知道的地方有写的东西。"
      - pinyin: "{{Word:ta1}} {{word:shuo1}}-{{word:qi3}} Hǎo-shuō-de."
        ttsText: "他说起好说的。"
        translation:
