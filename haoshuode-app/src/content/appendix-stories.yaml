        4. **{{word:ren2}}-{{word:de}} {{word:nv3ren2}} {{word:yao4}} {{word:hen3}} {{word:duo1}} {{word:qian2}}.** — Жена этого человека хочет много денег.
        5. **{{word:zai4}}-{{word:shui3}}-lǐ-{{word:de}} {{word:dong4wu4}} {{word:gei3}} {{word:ta1}} {{word:qian2}}.** — Плавающее животное даёт ей денег.
        6. **{{word:nv3ren2}} {{word:yao4}} {{word:bian4}} {{word:hen3}} {{word:da4}}-{{word:de}} {{word:ren2}}.** — Жена хочет стать очень важной персоной.
        7. **{{word:zai4}}-{{word:shui3}}-lǐ-{{word:de}} {{word:dong4wu4}} {{word:hen3}} {{word:huai4}}. {{word:qian2}} {{word:mei2}} {{word:you3}} {{word:le}}.** — Плавающее животное очень недовольно. Денег больше нет.
        8. **{{word:ren2}} {{word:he2}} {{word:nv3ren2}} {{word:mei2}} {{word:you3}} {{word:qian2}}.** — У человека и его жены совсем нет денег.
