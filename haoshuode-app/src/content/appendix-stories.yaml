        1. **{{word:ren2}} {{word:zai4}} {{word:shui3}} {{word:li3mian4}} {{word:zhao3}} dào {{word:zai4}}-{{word:shui3}}-lǐ-{{word:de}} {{word:dong4wu4}}.** — 一个人在水里捉到了一只会游泳的动物。
        2. **{{word:zai4}}-{{word:shui3}}-lǐ-{{word:de}} {{word:dong4wu4}} {{word:shuo1}}: {{word:wo3}} {{word:shi4}} {{word:qi2guai4}}-{{word:de}} {{word:zai4}}-{{word:shui3}}-lǐ-{{word:de}} {{word:dong4wu4}}. {{word:gei3}} {{word:wo3}} {{word:shui3}}, {{word:wo3}} {{word:gei3}} {{word:ni3}} {{word:hao3}}-{{word:de}} {{word:dong1xi}}.** — 会游泳的动物说话了：我是一只奇怪的会游泳的动物。把水还给我，我就给你好东西。
        3. **{{word:ren2}} {{word:ba3}} {{word:zai4}}-{{word:shui3}}-lǐ-{{word:de}} {{word:dong4wu4}} {{word:gei3}} {{word:shui3}}.** — 那人把会游泳的动物放回了水里。
        4. **{{word:ren2}}-{{word:de}} {{word:nv3ren2}} {{word:yao4}} {{word:hen3}} {{word:duo1}} {{word:qian2}}.** — 那人的妻子想要很多钱。
        5. **{{word:zai4}}-{{word:shui3}}-lǐ-{{word:de}} {{word:dong4wu4}} {{word:gei3}} {{word:ta1}} {{word:qian2}}.** — 会游泳的动物给了她钱。
        6. **{{word:nv3ren2}} {{word:yao4}} {{word:bian4}} {{word:hen3}} {{word:da4}}-{{word:de}} {{word:ren2}}.** — 妻子想要变成一个非常重要的人物。
        7. **{{word:zai4}}-{{word:shui3}}-lǐ-{{word:de}} {{word:dong4wu4}} {{word:hen3}} {{word:huai4}}. {{word:qian2}} {{word:mei2}} {{word:you3}} {{word:le}}.** — 会游泳的动物很生气。钱一下子就没了。
        8. **{{word:ren2}} {{word:he2}} {{word:nv3ren2}} {{word:mei2}} {{word:you3}} {{word:qian2}}.** — 那人和妻子什么钱都没有了。
    tldr:
      eng: "A swimming animal grants wishes until the wife asks for too much, and loses everything."
      rus: "Плавающее животное исполняет желания, пока жена не просит слишком многого, и в итоге теряет всё."
      zh: "会游泳的动物一直满足愿望，直到妻子要求得太多，最后一切都失去了。"
