          rus: "{{Word:zhe4}}-ge {{word:shi4}} {{word:xie3}}-{{word:de}} {{word:dong1xi}}."
          zh: "{{Word:zhe4}}-ge {{word:shi4}} {{word:xie3}}-{{word:de}} {{word:dong1xi}}."
        ttsText: "这个是写的东西。"
      - text:
          eng: "{{Word:nv3ren2}} {{word:shi4}} {{word:ren2}}."
          rus: "{{Word:nv3ren2}} {{word:shi4}} {{word:ren2}}."
          zh: "{{Word:nv3ren2}} {{word:shi4}} {{word:ren2}}."
        ttsText: "女人是人。"
      - text:
          eng: "{{Word:dong4wu4}} {{word:shi4}} {{word:dong1xi}}."
          rus: "{{Word:dong4wu4}} {{word:shi4}} {{word:dong1xi}}."
          zh: "{{Word:dong4wu4}} {{word:shi4}} {{word:dong1xi}}."
        ttsText: "动物是东西。"
