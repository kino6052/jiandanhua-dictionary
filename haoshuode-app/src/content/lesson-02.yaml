  - type: prose
    text:
      eng: |-
        Look again at <audio-example zh="东西">{{word:dong1xi}}</audio-example> and <audio-example zh="女人">{{word:nv3ren2}}</audio-example> above. <audio-example zh="东西">{{word:dong1xi}}</audio-example> is built from <audio-example zh="东">dōng</audio-example> (east) and <audio-example zh="西">xi</audio-example> (west) — yet it means "thing," with no geography left in it. <audio-example zh="女人">{{word:nv3ren2}}</audio-example> is more transparent: <audio-example zh="女">nǚ</audio-example> (female) plus <audio-example zh="人">{{word:ren2}}</audio-example> (person) gives you "woman" plainly. Chinese words are built from roots the same way English words are — `understand` is `under` plus `stand`, `telephone` is `far` plus `sound` — but a fluent speaker doesn't reassemble the parts to get the meaning. A word is learned whole; its roots are history, not a formula you run each time you use it.
      rus: "Обратите внимание на слова <audio-example zh=\"\">{{word:dong1xi}}</audio-example> и <audio-example zh=\"\">{{word:nv3ren2}}</audio-example>."
      zh: "To be added"

  - type: info
    title:
      eng: "To be added"
      rus: "Пример"
      zh: "To be added"
    items:
      - text:
          eng: "To be added"
          rus: "*Cлово*: <b>Dongxi</b>"
          zh: "To be added"
        items:
          - text:
              eng: "To be added"
              rus: '*Слоги:* <b>dōng</b> (восток) + <b>xi</b> (запад)'
              zh: "To be added"
            items:
              - text:
                  eng: "To be added"
                  rus: '*Значение:* "вещь", слово не имеющее никакого отношения к географии.'
                  zh: "To be added"

      - text:
          eng: "To be added"
          rus: "*Cлово:* <b>Nǚrén</b>"
          zh: "To be added"
        items:
          - text:
              eng: "To be added"
              rus: '*Слоги:* <b>nǚ</b> (женский) + <b>rén</b> (человек)' 
              zh: "To be added"
            items:
            - text:
                eng: "To be added"
                rus: '*Значение:* "женщина" и этот пример ближе к нашему привычному способу построения сложных слов из нескольких корней'
                zh: "To be added"


  - type: prose
    text:
      eng: |-
        Look again at <audio-example zh="东西">{{word:dong1xi}}</audio-example> and <audio-example zh="女人">{{word:nv3ren2}}</audio-example> above. <audio-example zh="东西">{{word:dong1xi}}</audio-example> is built from <audio-example zh="东">dōng</audio-example> (east) and <audio-example zh="西">xi</audio-example> (west) — yet it means "thing," with no geography left in it. <audio-example zh="女人">{{word:nv3ren2}}</audio-example> is more transparent: <audio-example zh="女">nǚ</audio-example> (female) plus <audio-example zh="人">{{word:ren2}}</audio-example> (person) gives you "woman" plainly. Chinese words are built from roots the same way English words are — `understand` is `under` plus `stand`, `telephone` is `far` plus `sound` — but a fluent speaker doesn't reassemble the parts to get the meaning. A word is learned whole; its roots are history, not a formula you run each time you use it.
      rus: |-
        Из этих примеров мы видим, что китайские слова строятся из корней точно так же как русские и английские.  

        У нас в языке тоже есть композитные слова: к примеру "самолет" ("сам" + "лет") и "паровоз" ("пар" + "воз"). 

        Мы не собираем эти слова из частей каждый раз, а выучиваем слово целиком. Состав слова — это история, а не формула, которую нужно применять каждый раз при его использовании в речи.

        Слова в Hǎo-shuō-de следуют этому же приинципу.

        Каждое слово из словаря запоминается целиком, вместе со всеми корнями-слогами. 

        Одним из ограничений Hǎo-shuō-de является то, что этот язык не позволяет создавать новые базовые слова, которые пишутся слитно. 

        
        Если вам нужно создать слово, которого нет в словаре, вы не будете соединять два корня в цельное слово — вы соедините их через дефис.

        (Здесь нужен пример)

        <h2>Отсутствие множественного числа</h2>

        Существительные в Hǎo-shuō-de нейтральны к числу.

        Количество определяет <i>контекст</i>.

        Например слово nǚrén может читаться как “женщина“, так и “женщины“ в зависимости от ситуации.
 
        Однако в словаре Hǎo-shuō-de все-таки есть слово “много“, и в предложении оно ставится отдельно от существительного к которому его применяют.

        Форма самого существительного никогда не меняется, независимо от количества которое оно подразумевает.

        Об этом мы поговорим подробнее в следующей главе.

        (Нужен пример)

        
        <h2>Указание на предметы</h2>

      zh: |-
        To be added

  - type: prose
    text:
      eng: |-
        To be added.
      rus: 'Чтобы сказать “этот“ или “тот“ в Hǎo-shuō-de, указательные местоимения <audio-example zh="东西">{{word:zhe4}}</audio-example> (это) и <audio-example zh="东西">{{word:na4}}</audio-example> (то) соединяются с окончанием -gè через дефис.'
      zh: "To be added"

  - type: info
    title:
      eng: "Правило"
      rus: "Правило"
      zh: "Правило"
    items:
      - text:
          eng: "To be added"
          rus: "<b>Zhè</b> (это) + <b>ge</b>"
          zh: "To be added"
        items:
          - text:
              eng: "To be added"
              rus: "<b>Zhè-ge</b> (этот)"
              zh: "To be added"
      - text:
          eng: "To be added"
          rus: "<b>Nà</b> (то) + <b>ge</b>"
          zh: "To be added"
        items:
          - text:
              eng: "To be added"
              rus: "<b>Nà-ge</b> (тот)"
              zh: "To be added"

  - type: prose
    text:
      eng: |-
        To be added
      rus: |-      
        Таким образом, gè является универсальным счетным словом.

        
        <h2>Зачем нужно лишнее слово gè?</h2>

        Рассмотрим слово rén. Само по себе оно значит не одного конкретного человека или группу людей. Слово rén означит человека как понятие/идею.

        Чтобы укзать на одного конкретного человка нужно добавить эту самую частицу -ge, которая превратит общее понятие в исчисляемое.

        К примеру, в русском языке мы говорим “бумага“, когда подразумеваем материал, а “лист бумаги“ будет означать уже более конкретную исчисляемую вещь.

        В китайском все без исключения существительные подчиняются этому правилу.

      zh: "To be added"

  - type: info
    title:
      eng: "Правило"
      rus: "Правило"
      zh: "Правило"
    items:
      - text:
          eng: "To be added"
          rus: "Частицу <b>ge</b> нельзя пропустить"
          zh: "To be added"
        items:  
          - text:
            eng: "To be added"
            rus: "<b>Zhè ren</b> -- звучит не законченно по смыслу"
            zh: "To be added"
          - text:
            eng: "To be added"
            rus: "<b>Zhè-ge ren</b> -- завершает мысль"
            zh: "To be added"

  - type: prose
    text:
      eng: |-
      rus: |-

        В настоящем мандаринском существуют десятки подобных счетных слов, превращающих существительное в разные словесные формы (плоские предметы, длинные предметы, животные, переплетённые книги и т.д.)

        Подобрать правильную частицу для каждой ситуации — одна из самых трудных задач для изучающих китайский язык.

        Hǎo-shuō-de не использует это множество ненужных частиц.
        
        Слово gè считает всё подряд, в любом контексте.

      
        <h2>Превращение глагола в существительное</h2>

        В мандаринском языке можно легко создавать существительные из глаголов.

        Нужно только добавить частицу -de

        В словаре Hǎo-shuō-de слова «книга», «бумага» или «документ» отсутствуют. Вместо этого используется одно емкое составное слово *xiě-de dōngxi*, что значит “написанная вещь“.

      zh: |-  

  - type: info
    title:
      eng: "to"
      rus: "Превращение глагола в существительное"
      zh: "Правило"
    items:
      - text:
          eng: "To be added"
          rus: "<b>Xiě</b> (писать) + <b>de</b>"
          zh: "To be added"
        items:
          - text:
              eng: "To be added"
              rus: "<b>Xiě-de</b> (написанный)"
              zh: "To be added"

  - type: prose
    text:
      eng: "to be added"
      rus: |-
        <h2>Частицы слов и частицы предложений</h2>

        В Hǎo-shuō-de есть частицы которые добавляются к слову чтобы изменить его значение. С ними мы уже познакомились. Это частицы “ge“ и “de“. Они присоединяются к концу слова через дефис.

        Также есть частицы которые добавляются внутрь структуры предложения (а не к самим словам), чтобы изменить смысл предложения целиком. Это, например, частица которая делает действие в предложении завершенным, или частица которая превращает предложение в вопрос. Они не присоединяются к конкретным словам, и не пишутся через дефис. Мы будем знакомится с ними в следующих уроках. 

        Запомните это простое правило
      zh: "to be added"

  - type: info
    title:
      eng: "to be added"
      rus: "Правило"
      zh: "to be added"
    items:
      - text:
          eng: "To be added"
          rus: "Если частица приклеена к слову через дефис — она формирует значение этого слова"
          zh: "To be added"
      - text:
          eng: "To be added"
          rus: "Если частица стоит свободно — она формирует значение целого предложения."
          zh: "To be added"      



    tldr:
      eng: "Compound words are learned whole; their roots are history, not a formula."
      rus: "Составные слова заучиваются целиком; их корни — история, а не формула."
      zh: "复合词是整体记住的；字根是它的来历，不是公式。"
    necessity:
      eng: "Sets expectations for how to treat multi-syllable dictionary words."
      rus: "Задаёт, как относиться к многослоговым словарным словам."
      zh: "确定该如何对待多音节的词典词。"

 
