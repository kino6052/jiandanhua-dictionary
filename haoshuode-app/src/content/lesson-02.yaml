id: lesson-02
type: lesson
lessonNumber: 2
order: 2
title:
  eng: "Words"
  rus: "Слова"
  zh: "词语"

summary:
  eng: "Hao-shuo-de words are memorized whole, never invented on the fly; nouns have no plural, \"this/that\" hyphenates to the one universal measure word gè, and adding -de to a verb turns it into a noun."
  rus: "Слова Hao-shuo-de заучиваются целиком и никогда не изобретаются на ходу; у существительных нет множественного числа, «это/то» присоединяется дефисом к единственному универсальному счётному слову gè, а частица -de превращает глагол в существительное."
  zh: "Hao-shuo-de 的词都是整体记住的，从不临时造词；名词没有复数，\"这个/那个\"通过连字符接到唯一的通用量词 gè 上，动词加上 -de 就变成名词。"

